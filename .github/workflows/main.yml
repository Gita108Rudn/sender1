name: Build Standalone Windows Executable

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSVC (Visual Studio Compiler)
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install OpenCV via vcpkg (Static)
      run: |
        # Устанавливаем статическую версию OpenCV с базовым набором функций.
        # videoio и imgcodecs уже включены в default-features.
        vcpkg install opencv[core,default-features]:x64-windows-static

    - name: Configure CMake
      run: |
        # Настраиваем проект с указанием статического триплета vcpkg.
        # CMake автоматически найдет OpenCV и применит нужные флаги (/MT).
        cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static

    - name: Build with MSVC
      run: |
        # Собираем проект в конфигурации Release
        cmake --build build --config Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sender-standalone
        path: build/Release/sender.exe
