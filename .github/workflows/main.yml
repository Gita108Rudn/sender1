name: Build Standalone Windows Executable (MinGW Static)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MinGW-w64
      uses: egor-tensin/setup-mingw@v2
      with:
        version: 12.2.0 # Используем стабильную версию

    - name: Build OpenCV 5.0.0 from source
      shell: cmd
      run: |
        REM Скачиваем исходники OpenCV 5.0.0 и opencv_contrib
        curl -L -o opencv.zip https://github.com/opencv/opencv/archive/refs/tags/5.0.0.zip
        curl -L -o opencv_contrib.zip https://github.com/opencv/opencv_contrib/archive/refs/tags/5.0.0.zip
        7z x opencv.zip
        7z x opencv_contrib.zip
        ren opencv-5.0.0 opencv
        ren opencv_contrib-5.0.0 opencv_contrib

        REM Создаем папку для сборки
        mkdir build
        cd build

        REM Конфигурируем CMake для статической сборки с MinGW
        cmake -G "MinGW Makefiles" ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DBUILD_SHARED_LIBS=OFF ^
          -DBUILD_opencv_world=ON ^
          -DWITH_OPENCL=OFF ^
          -DWITH_IPP=OFF ^
          -DBUILD_TESTS=OFF ^
          -DBUILD_PERF_TESTS=OFF ^
          -DBUILD_EXAMPLES=OFF ^
          -DOPENCV_EXTRA_MODULES_PATH=../opencv_contrib/modules ^
          ../opencv

        REM Собираем и устанавливаем OpenCV
        mingw32-make -j4
        mingw32-make install

    - name: Compile sender.cpp with static OpenCV
      shell: cmd
      run: |
        REM Компилируем наш sender.cpp, используя установленную статическую OpenCV
        REM Обратите внимание на пути: они соответствуют стандартному install для MinGW
        g++ sender.cpp -o sender.exe -std=c++17 ^
          -I"C:/Program Files/opencv/build/install/include" ^
          -L"C:/Program Files/opencv/build/install/x64/mingw/lib" ^
          -lopencv_world500 ^
          -lws2_32 -static-libgcc -static-libstdc++

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sender-standalone
        path: sender.exe
