name: Build Standalone Windows Executable

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSVC (Visual Studio Compiler)
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install OpenCV via vcpkg (Static)
      run: |
        # vcpkg уже предустановлен на раннере windows-latest
        # Устанавливаем статическую версию OpenCV
        vcpkg install opencv[core,imgproc,highgui,videoio,imgcodecs]:x64-windows-static

    - name: Compile Static EXE
      run: |
        # Компилируем с флагом /MT (статический рантайм)
        # Указываем пути к установленным через vcpkg заголовкам и библиотекам
        cl.exe sender.cpp /std:c++17 /EHsc /O2 /MT ^
          /I "C:\vcpkg\installed\x64-windows-static\include" ^
          /Fe:sender.exe ^
          /link ^
          /LIBPATH:"C:\vcpkg\installed\x64-windows-static\lib" ^
          opencv_world4.lib ws2_32.lib

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sender-standalone
        path: sender.exe
