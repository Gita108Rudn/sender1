name: Build Windows Executable

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Позволяет запускать сборку вручную

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-opencv
          mingw-w64-x86_64-pkgconf

    - name: Compile with MinGW
      shell: msys2 {0}
      run: |
        # Используем pkg-config. Если он не найдет opencv5, попробует opencv4.
        OPENCV_FLAGS=$(pkg-config --cflags --libs opencv5 || pkg-config --cflags --libs opencv4)
        g++ sender.cpp -o sender.exe -std=c++17 $OPENCV_FLAGS -lws2_32 -static-libgcc -static-libstdc++

    - name: Copy required DLLs
      shell: msys2 {0}
      run: |
        # Копируем DLL файлы OpenCV и системные зависимости из папки MSYS2
        cp /mingw64/bin/libopencv*.dll . || true
        cp /mingw64/bin/libwinpthread-1.dll . || true
        cp /mingw64/bin/libgcc_s_seh-1.dll . || true
        cp /mingw64/bin/libstdc++-6.dll . || true

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sender-windows-build
        path: |
          sender.exe
          *.dll
