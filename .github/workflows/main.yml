name: Build Standalone Windows Executable

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSVC (Visual Studio Compiler)
      uses: ilammy/msvc-dev-cmd@v1

    - name: Download OpenCV Windows (with static libs)
      run: |
        # Скачиваем официальный архив OpenCV (около 250 МБ)
        curl -L -o opencv-installer.exe https://github.com/opencv/opencv/releases/download/4.10.0/opencv-4.10.0-windows.exe
        # Распаковываем его без установки
        ./opencv-installer.exe -o"C:\opencv" -y

    - name: Compile Static EXE
      run: |
        # Компилируем с флагом /MT (статический рантайм)
        # Указываем пути к статическим библиотекам OpenCV (vc16/staticlib)
        cl.exe sender.cpp /std:c++17 /EHsc /O2 /MT /I "C:\opencv\build\include" /Fe:sender.exe /link /LIBPATH:"C:\opencv\build\x64\vc16\staticlib" opencv_world4100.lib ws2_32.lib

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sender-standalone
        path: sender.exe
