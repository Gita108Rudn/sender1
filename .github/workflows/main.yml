name: Build Standalone Windows Executable

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSVC (Visual Studio Compiler)
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install OpenCV via vcpkg (Static)
      run: |
        # Устанавливаем статическую версию OpenCV с базовым набором функций.
        # Функции videoio и imgcodecs не указываются отдельно, так как они
        # входят в стандартную сборку или подтягиваются как зависимости.
        vcpkg install opencv[core,default-features]:x64-windows-static

    - name: Compile Static EXE
      run: |
        # Компилируем с флагом /MT (статический рантайм).
        # Обратите внимание на путь к заголовкам: vcpkg добавляет подпапку opencv4.
        cl.exe sender.cpp /std:c++17 /EHsc /O2 /MT ^
          /I "C:\vcpkg\installed\x64-windows-static\include\opencv4" ^
          /Fe:sender.exe ^
          /link ^
          /LIBPATH:"C:\vcpkg\installed\x64-windows-static\lib" ^
          opencv_world4.lib ws2_32.lib

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sender-standalone
        path: sender.exe
